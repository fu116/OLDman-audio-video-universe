<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Profile - OLDman</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <div class="welcome-container" style="max-width: 450px">
      <h1>Edit Profile</h1>
      <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 20px">
        Update your public display name and bio.
      </p>

      <form method="POST" class="auth-form">
        <div class="form-group" style="margin-bottom: 15px">
          <label
            class="form-lable"
            style="font-size: 12px; color: var(--text-muted)"
            >Display Name</label
          >
          <input
            type="text"
            name="full_name"
            value="{{ profile.full_name }}"
            class="form-input"
            required
          />
        </div>

        <div class="form-group" style="margin-bottom: 20px">
          <label
            class="form-lable"
            style="font-size: 12px; color: var(--text-muted)"
            >Bio</label
          >
          <textarea
            name="bio"
            rows="4"
            class="form-input"
            style="resize: vertical"
          >
{{ profile.bio }}</textarea
          >
        </div>

        <div style="display: flex; gap: 10px">
          <button
            type="submit"
            class="btn-primary"
            style="flex: 1; padding: 12px; border-radius: 12px"
          >
            Save Changes
          </button>
          <a
            href="{{ url_for('profile', username=session['username']) }}"
            class="btn-secondary"
            style="
              flex: 1;
              padding: 12px;
              line-height: normal;
              text-align: center;
              border-radius: 12px;
            "
          >
            Cancel
          </a>
        </div>
      </form>
    </div>
  </body>
</html>
