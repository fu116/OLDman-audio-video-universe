<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OLDman - Home</title>
    <!-- Font Awesome CDN Link -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body>
    {% include 'components/nav.html' %}
    <section class="welcome-section">
      <div class="corner_buttons">
        <a
          href="{{ url_for('auth.register') }}"
          class="create_account btn-link"
        >
          Sign up <i class="fa-solid fa-headphones"></i>
        </a>
        <a href="{{ url_for('auth.login') }}" class="Login_account btn-link">
          Login <i class="fa-solid fa-headphones"></i>
        </a>
      </div>

      <div class="welcome-container">
        <div class="logo-wrapper">
          <img
            src="{{ url_for('static', filename='images/logo_without_bg.svg') }}"
            alt="OLDMAN_LOGO"
            class="hero-logo"
          />
        </div>

        <h1>OLDman</h1>
        <p>The ultimate audio & video universe.</p>
        <div class="spinner"></div>

        <a href="{{ url_for('content.feed') }}" class="create-btn btn-link">
          <i class="fa-solid fa-headphones"></i>
          Explore OLDman
          <i class="fa-solid fa-headphones"></i>
        </a>
      </div>
    </section>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  </body>
</html>
