<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OLDman - Login</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <div class="welcome-container">
      <div class="logo-wrapper">
        <img
          src="{{ url_for('static', filename='images/OLDMAN_LOGO.svg') }}"
          alt="OLDman Logo"
          class="logo"
        />
      </div>

      <h1>Welcome Back</h1>
      <p>Sign in to the audio & video universe</p>

      <!-- Flash Messages -->
      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %}
      <div class="flash-messages">
        {% for category, message in messages %}
        <!-- Make sure category is inside the class attribute properly -->
        <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
      {% endif %} {% endwith %}

      <form action="{{ url_for('login') }}" method="POST" class="auth-form">
        <div class="form-group">
          <label for="username" class="form-lable">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-input"
            required
            autocomplete="username"
          />
        </div>

        <div class="form-group">
          <label for="password" class="form-lable">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            required
            autocomplete="current-password"
          />
        </div>

        <button type="submit" class="btn-primary">Log In</button>
      </form>

      <p style="margin-top: 16px">
        Don't have an account?
        <a
          href="{{ url_for('register_page') }}"
          style="color: var(--accent-color); text-decoration: none"
          >Register here</a
        >
      </p>
    </div>
  </body>
</html>
