<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OLDman - Register</title>
    <link
      rel="stylesheet"
      href="{{url_for('static' , filename='css/style.css')}}"
    />
  </head>
  <body>
    <div class="welcome-container">
      <div class="logo-wrapper">
        <img
          src="{{url_for('static', filename='images/OLDMAN_LOGO.svg')}}"
          alt="oldman_logo"
          class="logo"
        />
      </div>
      <h1>Create Account</h1>
      <p>Join the audio & video universe</p>
      <!-- Registration Form -->

      <form action="/register" method="POST" class="auth-form">
        <div class="form-group">
          <label for="username" class="form_lable">Username</label>
          <input type="text" name="username" class="form-input" required />
        </div>

        <div class="form-group">
          <label for="email" class="form_lable">Email</label>
          <input type="text" name="email" class="form-input" required />
        </div>

        <div class="form-group">
          <label for="Password" class="form_lable">Password</label>
          <input type="password" name="password" class="form-input" required />
        </div>

        <button type="submit" class="btn-primary">Sign UP</button>
      </form>
      {% with messages =get_flashed_messages() %} {% if messages %}
      <p class="status_text" style="margin-top: 15px">{{messages[0]}}</p>

      {% endif %} {% endwith %}
    </div>
  </body>
</html>
