<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OLDman - Register</title>
    <!-- Font Awesome CDN Link -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="{{url_for('static' , filename='css/style.css')}}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/figmaone_icons.css') }}"
    />
  </head>
  <body>
    {% include 'components/nav.html' %}
    <section class="register_section">
      <div class="register_container">
        <div class="register_logo_wrapper">
          <img
            src="{{url_for('static', filename='images/logo_without_bg.svg')}}"
            alt="oldman_logo"
            class="logo"
          />
        </div>
        <h1>Create Account</h1>
        <p>Join the audio & video universe</p>

        <!-- Registration Form -->

        <form action="/register" method="POST" class="auth-form">
          <div class="form-groupf">
            <label for="username" class="form_lable"></label>
            <input
              type="text"
              name="username"
              class="form-input"
              placeholder="Username"
              required
            />
          </div>
          <div class="form-group">
            <label for="email" class="form_lable"></label>
            <input
              type="text"
              name="email"
              class="form-input"
              placeholder="Email"
              required
            />
          </div>
          <div class="form-group">
            <label for="Password" class="form_lable"></label>
            <input
              type="password"
              name="password"
              class="form-input"
              placeholder="Password"
              required
            />
          </div>
          <button type="submit" class="btn-primary">Sign UP</button>
        </form>
        {% with messages =get_flashed_messages() %} {% if messages %}
        <p class="status_text" style="margin-top: 15px">{{messages[0]}}</p>

        {% endif %} {% endwith %}
      </div>
    </section>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  </body>
</html>
